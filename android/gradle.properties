org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Gradle has no HTTP read timeout by default, so a silently dropped connection
# leaves the build waiting forever instead of failing. On an unstable link that
# looks exactly like a hang. Fail after 60s so the retry logic can do its job.
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.http.keepAlive=false
